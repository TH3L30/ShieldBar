name: Desktop build

on:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "helper/**"
      - ".github/workflows/desktop-build.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit tests, smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: helper/go.sum

      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 \
            libgtk-3-0 libgbm1 libdrm2 libxss1 libxcomposite1 libxdamage1 \
            libxrandr2 libxkbcommon0 libcups2 libpango-1.0-0 libcairo2 \
            libdbus-1-3 libglib2.0-0 libx11-6 libxext6 libxfixes3
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Helper tests
        working-directory: helper
        run: go test ./...

      - name: Helper interface integration test
        working-directory: helper
        run: sudo bash integration-test.sh

      - name: Build bundles
        run: npm run build

      - name: Headless smoke test
        run: xvfb-run -a npx electron . --smoke-test --no-sandbox

      - name: Live BrowserLeaks self-test
        continue-on-error: true
        run: xvfb-run -a npx electron . --self-test --no-sandbox

  build:
    name: Package ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: helper/go.sum

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 \
            libgtk-3-0 libgbm1 libdrm2 libxss1 libxcomposite1 libxdamage1 \
            libxrandr2 libxkbcommon0 libcups2 libpango-1.0-0 libcairo2 \
            libdbus-1-3 libglib2.0-0 libx11-6 libxext6 libxfixes3
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install dependencies
        run: npm ci

      - name: Windows PowerShell script tests
        if: runner.os == 'Windows'
        run: npx vitest run tests/windowsScripts.test.ts

      - name: Build privileged helpers
        run: npm run helper

      - name: Build bundles
        run: npm run build

      - name: Package Windows targets
        if: runner.os == 'Windows'
        timeout-minutes: 45
        run: npx electron-builder --win nsis zip --x64 --publish never

      - name: Package Linux targets
        if: runner.os == 'Linux'
        timeout-minutes: 30
        run: npx electron-builder --linux AppImage deb --x64 --publish never

      - name: Smoke test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "release\win-unpacked" -Filter "*.exe" |
            Where-Object { $_.Name -notmatch "ffmpeg|chrome_crashpad" } |
            Select-Object -First 1
          if (-not $exe) { throw "No packaged executable found" }
          $process = Start-Process -FilePath $exe.FullName `
            -ArgumentList "--smoke-test" -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Smoke test Linux package
        if: runner.os == 'Linux'
        run: |
          executable=$(find release/linux-unpacked -maxdepth 1 -type f -perm -111 -iname 'shieldbar' | head -n 1)
          if [ -z "$executable" ]; then
            echo "No packaged ShieldBar executable found" >&2
            exit 1
          fi
          echo "Smoke-testing $executable"
          xvfb-run -a "$executable" --smoke-test --no-sandbox

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shieldbar-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.blockmap

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate signed update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: node scripts/generate-update-manifest.mjs --output release-assets

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "ShieldBar $GITHUB_REF_NAME" \
            --generate-notes
