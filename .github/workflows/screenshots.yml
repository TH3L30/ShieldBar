name: UI screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            command: npx electron . --render-preview "$env:GITHUB_WORKSPACE/docs/screenshots/windows"
          - os: ubuntu-latest
            platform: linux
            command: xvfb-run -a npx electron . --render-preview "$GITHUB_WORKSPACE/docs/screenshots/linux" --no-sandbox
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 \
            libgtk-3-0 libgbm1 libdrm2 libxss1 libxcomposite1 libxdamage1 \
            libxrandr2 libxkbcommon0 libcups2 libpango-1.0-0 libcairo2 \
            libdbus-1-3 libglib2.0-0 libx11-6 libxext6 libxfixes3
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Render screenshots
        run: ${{ matrix.command }}

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ github.workspace }}/docs/screenshots/${{ matrix.platform }}
